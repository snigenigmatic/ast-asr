# RL post-training via GRPO on the ft-w2v2 checkpoint.
# Optimizes WER accuracy + demographic parity fairness via
# multi-component reward and 3-stage curriculum.

checkpoint:
  path: outputs/checkpoints/ft-w2v2/final

rl:
  algorithm: grpo
  beam_width: 8
  temperature: 1.2
  beta_kl: 0.1
  max_steps: 3000
  lr: 5.0e-6
  grad_clip: 1.0
  batch_size: 4
  gradient_accumulation: 4
  bf16: true

reward:
  cer_weight: 0.6
  wer_weight: 0.4
  alpha_fairness: 2.0
  fairness_threshold: 0.05
  rejection_wer_threshold: 0.9

curriculum:
  stages:
    - name: easy
      families: [Indo-Aryan]
      max_duration: 5.0
      family_weights: {Indo-Aryan: 1.0}
      noise_prob: 0.0
      min_step: 0
      max_step: 500
    - name: medium
      families: [Indo-Aryan, Dravidian]
      max_duration: 10.0
      family_weights: {Indo-Aryan: 1.0, Dravidian: 1.0}
      noise_prob: 0.3
      noise_snr_range: [10.0, 20.0]
      min_step: 500
      max_step: 1500
    - name: hard
      families: [Indo-Aryan, Dravidian, Sino-Tibetan]
      max_duration: 15.0
      family_weights: {Indo-Aryan: 1.0, Dravidian: 1.0, Sino-Tibetan: 3.0}
      noise_prob: 0.5
      noise_snr_range: [5.0, 15.0]
      min_step: 1500
      max_step: 3000

data:
  raw_root: data/spire-sies/raw
  split_path: data/spire-sies/splits.json
  languages: null
  min_duration: 1.0
  max_duration: 20.0
  min_words: 3
  seed: 42

eval:
  svarah_samples: 50
  eval_every: 200
  save_every: 500

output:
  dir: outputs/checkpoints/rl-grpo
  log_every: 10
