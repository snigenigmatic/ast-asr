model:
  id: openai/whisper-small
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - out_proj

rl:
  K: 4
  temperature: 1.2
  beta_kl: 0.1
  max_steps: 3000
  lr: 2.0e-5
  grad_clip: 1.0
  batch_size: 3
  gradient_accumulation: 4
  bf16: true
  eval_interval: 100
  save_interval: 500
  eval_samples: 50
  weight_decay: 0.0

reward:
  cer_weight: 0.6
  wer_weight: 0.4
  alpha_fairness: 2.0
  fairness_threshold: 0.05

output:
  dir: outputs/checkpoints/whisper-small-rl
