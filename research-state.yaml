project:
  title: "FR-CISPO: fair and robust post-training for tiny Indian-English ASR"
  question: >-
    Can openai/whisper-tiny be adapted on Svarah to improve worst-group
    Indian-English ASR performance under clean and noisy conditions without
    materially degrading clean overall WER?
  status: active
  started: "2026-08-11"
  branch: codex/fair-cispo-tiny
  worktree: "C:/Kaustubh/ast-asr-worktrees/fair-cispo-tiny"

research_contract:
  model: openai/whisper-tiny
  model_revision: 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
  transcribed_corpus: ai4bharat/Svarah
  dataset_revision: ebbf7777fe771490696a3f7b007097606fa8c924
  external_audio_use: "MUSAN noise only; never as transcribed speech"
  primary_endpoint: "worst family x acoustic-condition WER from out-of-fold predictions"
  clean_regression_limit_absolute_wer: 0.01
  development_improvement_required_absolute_wer: 0.02
  development_seeds: 3
  required_authoritative_speakers: 117

evidence_status:
  speaker_identity:
    status: blocked_external
    observed_profile_clusters: 115
    required_authoritative_speakers: 117
    publication_valid: false
    note: >-
      Reachable official GitHub history contains no release files, and all seven
      accessible Hugging Face Parquet revisions omit speaker_id. Current folds
      use demographic profile clusters and support engineering smoke tests only.
  evaluation_precision:
    status: repaired
    note: >-
      FP16 Whisper decoding produced a deterministic solo-versus-batch mismatch;
      evaluation now casts the model to FP32 and has regression coverage.
  checkpoint_round_trip:
    status: passing
  policy_safety:
    status: failed
    note: >-
      None of the preregistered learning rates completed 300 cycles while
      satisfying per-token KL < 0.1.

hypotheses:
  - id: H0
    statement: >-
      One of {1e-5, 3e-5, 1e-4} can run FR-CISPO for 300 cycles while ratio p99
      remains below 2 and per-token KL from SFT remains below 0.1.
    status: refuted
    evidence:
      - "1e-4 probe: ratio p99 2.477, KL 0.2958"
      - "3e-5 full run: ratio p99 1.8218, KL 43.9888"
      - "1e-5 full run: ratio p99 1.2069, KL 1.1638"
  - id: H1
    statement: >-
      Explicit KL control can preserve genuine live off-policy ratio movement
      while keeping the policy inside the preregistered trust region.
    status: safety_signal_passed_with_artifact_naming_deviation
    classification: exploratory_engineering
  - id: H2
    statement: >-
      Replacing profile-cluster pseudo-speakers with the authoritative 117
      Svarah speakers yields valid speaker-disjoint folds and may materially
      change group-risk estimates.
    status: blocked_external

