project:
  title: "FR-CISPO: fair and robust post-training for tiny Indian-English ASR"
  question: >-
    Can openai/whisper-tiny be adapted on Svarah to improve worst-group
    Indian-English ASR performance under clean and noisy conditions without
    materially degrading clean overall WER?
  status: active
  started: "2026-08-11"
  branch: codex/fair-cispo-tiny
  worktree: "C:/Kaustubh/ast-asr-worktrees/fair-cispo-tiny"

research_contract:
  model: openai/whisper-tiny
  model_revision: 169d4a4341b33bc18d8881c4b69c2e104e1cc0af
  transcribed_corpus: ai4bharat/Svarah
  dataset_revision: ebbf7777fe771490696a3f7b007097606fa8c924
  external_audio_use: "MUSAN noise only; never as transcribed speech"
  primary_endpoint: "worst family x acoustic-condition WER from out-of-fold predictions"
  clean_regression_limit_absolute_wer: 0.01
  development_improvement_required_absolute_wer: 0.02
  development_seeds: 3
  required_authoritative_speakers: 117

evidence_status:
  speaker_identity:
    status: blocked_external
    observed_profile_clusters: 115
    required_authoritative_speakers: 117
    publication_valid: false
    note: >-
      Reachable official GitHub history contains no release files, and all seven
      accessible Hugging Face Parquet revisions omit speaker_id. Current folds
      use demographic profile clusters and support engineering smoke tests only.
  evaluation_precision:
    status: repaired
    note: >-
      FP16 Whisper decoding produced a deterministic solo-versus-batch mismatch;
      evaluation now casts the model to FP32 and has regression coverage.
  checkpoint_round_trip:
    status: passing
  policy_safety:
    status: seed_unstable_at_40_cycles
    note: >-
      None of the preregistered learning rates completed 300 cycles while
      satisfying per-token KL < 0.1. Matched 40-cycle beta=0 and beta=0.04 H5
      runs both completed safely, and both seed-2027 H6 arms were safe. The
      seed-2028 beta-zero control failed the KL gate at cycle 27, so 40-cycle
      safety itself does not replicate across seeds.

hypotheses:
  - id: H0
    statement: >-
      One of {1e-5, 3e-5, 1e-4} can run FR-CISPO for 300 cycles while ratio p99
      remains below 2 and per-token KL from SFT remains below 0.1.
    status: refuted
    evidence:
      - "1e-4 probe: ratio p99 2.477, KL 0.2958"
      - "3e-5 full run: ratio p99 1.8218, KL 43.9888"
      - "1e-5 full run: ratio p99 1.2069, KL 1.1638"
  - id: H1
    statement: >-
      Explicit KL control can preserve genuine live off-policy ratio movement
      while keeping the policy inside the preregistered trust region.
    status: safe_short_horizon_signal_and_exploratory_wer_improvement
    classification: exploratory_engineering
    evidence:
      - "20 cycles: ratio p99 1.1732, KL/token 0.00916, 5/32 probe predictions changed"
      - "FP32 fold-0 clean WER 0.216564 and worst family-condition WER 1.034274"
      - "Worst family-condition improved 0.427419 absolute versus matched SFT"
      - "Unseen MUSAN remained 0.016183 absolute worse than zero-shot"
  - id: H2
    statement: >-
      Replacing profile-cluster pseudo-speakers with the authoritative 117
      Svarah speakers yields valid speaker-disjoint folds and may materially
      change group-risk estimates.
    status: blocked_external
  - id: H5
    statement: >-
      A beta=0.04 fixed-SFT sampled-K3 penalty reduces 40-cycle policy
      divergence relative to a matched beta-zero control while retaining live
      FR-CISPO movement and improving the provisional worst family-condition
      endpoint without more than 0.01 clean-WER regression.
    status: mechanism_supported_efficacy_unconfirmed
    classification: exploratory_engineering
    evidence:
      - "Matched 40-cycle runs: peak K3/token 0.0249191 at beta=0 versus 0.0164290 at beta=0.04"
      - "Both runs completed 160/160 optimizer steps with movement in all 40 cycles"
      - "Beta=0.04 worst family-condition WER improved 0.0221774 absolute versus beta=0"
      - "Beta=0.04 clean WER degraded 0.0006663, white WER 0.0059020, and MUSAN WER 0.0174203 versus beta=0"
      - "A 10,000-sample paired bootstrap over 39 fold-0 profile clusters included zero/harm for every registered delta"
  - id: H6
    statement: >-
      The matched beta-zero versus beta=0.04 H5 mechanism and provisional
      worst-group point improvement repeat over two additional fixed seeds.
    status: failed_safety
    classification: exploratory_engineering
    evidence:
      - "Seed 2027: beta=0.04 reduced peak K3/token 0.0762783 -> 0.0294708, but worst family-condition WER worsened 0.0040323 absolute"
      - "Seed 2027: clean and white WER improved slightly while MUSAN WER worsened 0.0148977 absolute"
      - "Seed 2028 beta-zero reached K3/token 0.1109513 at cycle 27 and failed the preregistered 0.1 gate"
      - "Seed 2028 treatment and both evaluations were not launched, as required by the locked stop rule"
  - id: H7
    statement: >-
      Rescoring the 28 historical seed-2028 candidate banks under one frozen
      last-safe policy and SFT reference reveals whether the current 0.1 K3
      classification changes with the saved bank while policy parameters stay
      fixed.
    status: measurement_failed
    classification: exploratory_measurement_validation
    evidence:
      - "Offline H6 localization found cycle-27 K3 0.1098355 before its optimizer passes and strong candidate-bank length association"
      - "Historical banks were generated by evolving policies, so H7 is a counterfactual bank-sensitivity test, not fresh on-policy variance"
      - "H7 changes no policy, reward, optimizer, candidate text, or WER selection"
      - "The original authorized attempt failed in the local Modal launcher before creating a task; the separately authorized r1 attempt reached the L4 container"
      - "H7 r1 failed before any model forward because a Windows/PyTorch-2.13 noisy-waveform byte lock did not reproduce under Linux/PyTorch-2.11"
      - "The fail-closed artifact is non-evaluable and no H7 threshold statistic exists"

