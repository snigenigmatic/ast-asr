[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-asr"
version = "0.1.0"
description = "Fair and robust post-training for Whisper-tiny on Indian English"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "peft>=0.18.1",
    "soundfile>=0.13.1",
    "torch>=2.9.1",
    "transformers>=5.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5"]

[project.scripts]
ast-asr = "ast_asr.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
